<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Consumer Rights Assistant</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="card">
        <h1>Consumer Rights Assistant</h1>
        <p class="subtitle">
          Ask a question about consumer protections and get a grounded answer with source references.
        </p>

        <form id="ask-form">
          <label for="question">Your question</label>
          <textarea id="question" name="question" rows="4" placeholder="Example: What is my liability if my credit card is stolen online?"></textarea>
          <div class="actions">
            <button type="submit">Ask</button>
            <button type="button" class="ghost" id="sample-btn">Try sample</button>
          </div>
        </form>

        <div id="status" class="status">Preparing your answer…</div>
        <div id="answer" class="answer"></div>
        <div id="sources" class="sources"></div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
